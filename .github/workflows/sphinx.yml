name: "Sphinx: Render docs"

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    # ammaraskar/sphinx-action runs an old image (Python 3.8, pip 20) that
    # cannot install docs/requirements.txt (sphinx>=7.2.6), so set up
    # Python directly.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: docs/requirements.txt
    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        # autodoc imports PlanetProfile, which reads its installed version.
        pip install -e . --no-deps
    - name: Build HTML
      working-directory: docs
      # Importing PlanetProfile asks to copy the default UserConfigs; answer yes.
      run: yes y | sphinx-build -b html . _build -v
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: html-docs
        path: docs/_build/
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build

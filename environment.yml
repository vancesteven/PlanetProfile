# Frozen conda environment for PlanetProfile inference/SBI reproducibility.
# Captured 2026-07-29 from the working PPcl env (mamba activate PPcl).
# scipy 1.17.1 matches requirements.txt (reconciled 2026-07-29 after the
#   Machine-A stale-function fixes cleared the <1.17 constraint). numpy 2.4.6.
# Install scipy/numpy via conda/mamba ONLY — never pip-install scipy into
#   this conda env (mixed conda/pip scipy builds cause _spropack ImportError).
# Recreate: mamba env create -f environment.yml

